name: Daily Picks Unit Tests
on:
  pull_request:
  push:
    branches:
      - feature/daily-picks-engine-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install network-client dependency for offline parser tests
        run: python -m pip install requests numpy pandas scikit-learn joblib flask flask-cors
      - name: Verify deployment files and Python syntax
        run: python -m unittest tests.test_deployment_contract -v
      - name: Compile Python modules
        run: python -m py_compile tennis_elo_research.py tennis_elo.py tennis_rank_history.py tennis_hf_research_backtest.py tennis_hf_crosswalk.py tennis_hf_audit.py tennis_source_audit.py tennis_backtest.py tennis_model_gate.py tennis_temporal.py tennis_daily_picks.py tennis_daily_tracker.py tennis_api.py tennis_models.py tennis_trainer.py tennis_odds.py tennis_schedule.py
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("index.html").read_text(encoding="utf-8")
          assert "<script>" in page and "</script>" in page
          script = page.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/tennis_oracle_frontend.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/tennis_oracle_frontend.js
      - name: Daily Picks stdlib tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
