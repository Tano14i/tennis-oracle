name: HF 2026 Winner Model Research Holdout (no deploy)
on:
  push:
    branches:
      - feature/daily-picks-engine-v2
    paths:
      - '.github/workflows/hf_winner_research_backtest.yml'
      - 'tennis_rank_history.py'
      - 'tennis_hf_research_backtest.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winner-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing model dependencies
        run: python -m pip install numpy pandas scikit-learn joblib requests
      - name: No bookmaker/model leakage smoke tests
        run: python -m unittest tests.test_hf_research_backtest -v
      - name: Real historical holdout and closing-market comparison
        env:
          ORACLE_RESEARCH_OUTPUT: hf_winner_rank_history_posthoc.json
        run: |
          python tennis_hf_research_backtest.py > /tmp/research.log 2>&1 || {
            tail -n 150 /tmp/research.log
            exit 1
          }
          cat hf_winner_rank_history_posthoc.json
      - name: Preserve aggregate research only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-winner-posthoc-rank-research
          path: hf_winner_rank_history_posthoc.json
          retention-days: 7
