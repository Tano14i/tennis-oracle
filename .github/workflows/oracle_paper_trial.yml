name: Tennis Oracle Prospective Paper Trial (research only)

# Scheduled workflows run only from the DEFAULT branch. Source code remains
# pinned to frozen oracle-paper-model-v1; live model deployment is untouched.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/oracle_paper_trial.yml'
  schedule:
    # Three UTC snapshots/day; GitHub scheduled runs can be delayed.
    - cron: '17 5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-paper-ledger-v1
  cancel-in-progress: false

jobs:
  capture-and-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout frozen research code (NO PRODUCTION DEPLOY)
        uses: actions/checkout@v4
        with:
          ref: oracle-paper-model-v1
          path: source
          persist-credentials: false

      - name: Checkout standalone paper ledger branch
        uses: actions/checkout@v4
        with:
          ref: oracle-paper-ledger
          path: ledger
          persist-credentials: true

      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install open-source research dependencies
        run: python -m pip install pandas numpy scikit-learn joblib requests

      - name: Validate immutable research contracts
        working-directory: source
        run: python -m unittest tests.test_paper_trial tests.test_paper_ledger tests.test_paper_settlement tests.test_elo -v

      - name: Stamp exact model commit
        run: echo "ORACLE_PAPER_MODEL_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capture upcoming fixtures BEFORE match start
        working-directory: source
        env:
          ORACLE_PAPER_OUTPUT: paper_snapshot.json
          # Bookmaker API calls are OFF. No paid API usage.
          ORACLE_PAPER_ODDS_ENABLE: '0'
        run: python tennis_paper_trial.py

      - name: Preserve first eligible forecast per fixture (never overwrite)
        working-directory: source
        run: |
          python tennis_paper_ledger.py \
            --snapshot paper_snapshot.json \
            --ledger ../ledger \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Settle only completed verifiable ESPN matches
        working-directory: source
        run: |
          python tennis_paper_settlement.py \
            --ledger ../ledger \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Commit research-only artifacts to ledger branch
        working-directory: ledger
        run: |
          git config user.name "Tennis Oracle Research Bot"
          git config user.email "tennis-oracle-research@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "paper: append prospective research run $GITHUB_RUN_ID"
            git push origin HEAD:refs/heads/oracle-paper-ledger
          fi

      - name: Upload diagnostic even on blocked days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-paper-run
          path: source/paper_snapshot.json
          retention-days: 30
          if-no-files-found: warn
