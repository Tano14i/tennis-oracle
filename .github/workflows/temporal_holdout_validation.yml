name: Historical Temporal Holdout Validation (one-off)
on:
  push:
    branches:
      - feature/daily-picks-engine-v2
    paths:
      - '.github/workflows/temporal_holdout_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline model dependencies
        run: python -m pip install pandas numpy scikit-learn requests joblib
      - name: Run pre-2024 train + 2024-onward temporal evaluation
        env:
          ORACLE_BACKTEST_TREES: '50'
          ORACLE_BACKTEST_JSON: 'backtest_results_v2_smoke.json'
        run: |
          python tennis_backtest.py > /tmp/tennis_holdout.log 2>&1 || {
            tail -n 120 /tmp/tennis_holdout.log
            exit 1
          }
          cat backtest_results_v2_smoke.json
      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tennis-chronological-backtest-v2-smoke
          path: backtest_results_v2_smoke.json
          retention-days: 7
